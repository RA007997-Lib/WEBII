<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercicio 4a</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 40px;
        }

        .titulo {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .card-exercicio {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        #resultado {
            font-family: Georgia, 'Times New Roman', serif;
            margin-top: 20px;
        }

        .imagem-exercicio {
            width: 100%;
            max-width: 130px;
        }
    </style>

</head>

<body>

    <div class="card-exercicio">

        <h2 class="titulo">Programa Par ou Ímpar</h2>

        <div class="row align-items-center">

            <div class="col-4 text-center">
                <img src="imagens/exerc.jpg" alt="Ilustração" class="imagem-exercicio">
            </div>

            <div class="col-8">

                <div class="mb-3 row align-items-center">

                    <label for="numero" class="col-sm-4 col-form-label">
                        Número:
                    </label>

                    <div class="col-sm-8">
                        <input type="number" class="form-control" id="numero" value="5">
                    </div>

                </div>

                <button class="btn btn-outline-secondary btn-sm" onclick="verificar()">
                    Verificar se é Par ou Ímpar
                </button>

                <p id="resultado" class="fw-bold"></p>

            </div>

        </div>

    </div>

    <script src="js/exerA.js"></script>

</body>

</html>
